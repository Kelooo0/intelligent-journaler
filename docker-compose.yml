services:
  db:
    image: postgres:15
    container_name: postgres_db
    restart: always
    environment:
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASS}
      - POSTGRES_DB=${DB_NAME}
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data

  api:
    build: .
    container_name: journaler
    ports:
      - '8000:8000'
    env_file:
      - .env
    environment:
      - DB_HOST=db
    depends_on:
      - db
    restart: always
    volumes:
      - .:/app

volumes:
  postgres_data:
